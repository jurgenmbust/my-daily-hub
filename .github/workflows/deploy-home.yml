name: Deploy website to home server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Deploy the website from main to the home server?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: home-server-website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require main and explicit confirmation
        if: ${{ github.ref != 'refs/heads/main' || !inputs.confirm }}
        run: |
          echo 'Choose main and tick the confirmation box.' >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test deployment gate
        run: |
          bash -n deploy/home/install.sh
          python3 -m unittest discover -s deploy/home/tests -v
      - name: Install, test and build website
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Record source revision
        env:
          REVISION: ${{ github.sha }}
        run: printf '%s\n' "$REVISION" > frontend/dist/deployment-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, daily-hub-deploy]
    timeout-minutes: 15
    steps:
      # No checkout, npm, repository scripts, Docker socket or server secrets here.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: website-${{ github.sha }}
          path: ${{ runner.temp }}/daily-hub-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy through the installed website-only gate
        env:
          WEBSITE: ${{ runner.temp }}/daily-hub-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tar -C "$WEBSITE" -czf - . | sudo -n /usr/local/sbin/my-daily-hub-deploy
      - name: Record success
        env:
          REVISION: ${{ github.sha }}
        run: |
          printf '### Website deployment succeeded\n\nRevision: `%s`\n\nHealth check passed.\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
